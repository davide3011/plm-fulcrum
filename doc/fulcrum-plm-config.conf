# Fulcrum configuration for Palladium (PLM) mainnet
# Pairs with a local palladiumd (txindex=1, RPC on port 2332).

# *REQUIRED* Database directory. Needs tens of GB free for mainnet. Use an SSD.
datadir = /home/davide3011/Desktop/PLM/fulcrum-db

# *REQUIRED* palladiumd RPC socket (rpcbind/rpcport in palladium.conf).
bitcoind    = 127.0.0.1:2332
rpcuser     = palladium
rpcpassword = palladium

# ZMQ is auto-discovered from palladiumd via the `getzmqnotifications` RPC
# (your palladium.conf already publishes rawblock/rawtx/hashblock), so no
# extra config is needed here.

# Electrum protocol listeners for wallets.
tcp = 0.0.0.0:50001
# ssl = 0.0.0.0:50002   # uncomment and set cert=/key= below to enable TLS
# cert = /path/to/server-cert.pem
# key  = /path/to/server-key.pem

# Admin RPC socket (required for the FulcrumAdmin CLI).
admin = 127.0.0.1:8000

# Peer discovery: disabled because there is no public PLM Electrum server
# network yet. Leaving it on is harmless (the error is caught and peering is
# skipped), but disabling avoids a startup error in the log.
peering  = false
announce = false
